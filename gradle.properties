# Gradle 配置
org.gradle.jvmargs=-Xmx2048m -XX:MetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.warning.mode=none
android.useAndroidX=true
# ✅ P2-4 修复：项目全 AndroidX，无旧 support 库依赖，关闭 Jetifier 可加速构建 10-30%
android.enableJetifier=false

# 编译 SDK 配置
android.suppressUnsupportedCompileSdk=34

# Kotlin 配置
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.compiler.execution.strategy=in-process

# 包装器配置
gradle.wrapperVersion=8.2
# ✅ P2-4 修复：移除 GRADLE_USER_HOME=.gradle，改用全局缓存
#   原项目本地缓存导致每次克隆重新下载依赖，CI/团队协作不友好

# ✅ P2-4 修复：移除过时的签名配置
#   android.enableV2Signing / enableV3Signing 在 AGP 8.x 已过时（默认行为），保留无意义
